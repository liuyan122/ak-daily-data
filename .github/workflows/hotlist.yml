name: 热榜资讯聚合
on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 抓取热榜并生成快照
        run: python scripts/hotlist.py
      - name: 每日归档提交到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p archive
          cp docs/history/*.json archive/ 2>/dev/null || true
          git add archive/
          git commit -m "热榜归档 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || echo "无归档变化"
          git push
      - name: 推送 GitHub Pages
        run: |
          git remote add pages https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          cp -r docs /tmp/docs
          git checkout -B gh-pages main
          git rm -rf .
          cp -r /tmp/docs/* .
          git add -A
          git commit -m "热榜快照 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push --force pages gh-pages
