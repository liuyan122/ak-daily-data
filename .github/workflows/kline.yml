name: A股日线增量更新
on:
  workflow_dispatch:
    inputs:
      commit_data:
        description: '手动运行时是否提交 data/ 增量（默认不提交，仅测试打包）'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'   # 依赖缓存：requirements 未变时直接走本地缓存
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 下载并打包增量
        run: python scripts/kline_update.py
      - name: 检查是否有增量
        id: delta
        if: ${{ github.event_name == 'schedule' || inputs.commit_data }}
        run: |
          if [ -f update_summary.json ] && grep -q '"skipped": true' update_summary.json; then
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "非交易日，跳过数据提交"
          else
            echo "has_data=true" >> "$GITHUB_OUTPUT"
            echo "today=$(date -u -d '+8 hours' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: 数据增量走 PR（留变更记录，便于回滚）
        id: cpr
        if: ${{ steps.delta.outputs.has_data == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            data/
            update_summary.json
          commit-message: "日线增量 ${{ steps.delta.outputs.today }}"
          title: "日线增量 ${{ steps.delta.outputs.today }}"
          body: "收盘后自动打包的日线增量数据，合并后供下游 15:50 拉取。"
          branch: "data/kline-${{ steps.delta.outputs.today }}"
          delete-branch: true
      - name: 合并数据 PR
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch --repo "$GITHUB_REPOSITORY"
      - name: 打包近一年全量窗口
        if: always()
        continue-on-error: true
        run: python scripts/full_year_pack.py
      - name: 提交全量包状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full_pack_summary.json || true
          git diff --cached --quiet || git commit -m "全量包状态 $(date -u -d '+8 hours' +%Y-%m-%d)" || true
          git push || true
      - name: 上传 artifact（灵光每日拉取）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kline-delta-${{ github.run_id }}
          path: |
            data/*.tsv.gz
            update_summary.json
          retention-days: 30
      - name: 上传全量包到 Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f data/full_year.tsv.gz ]; then echo "无全量包（非交易日或打包失败），跳过上传"; exit 0; fi
          D=$(date -u -d '+8 hours' +%Y%m%d)
          cp data/full_year.tsv.gz /tmp/kline-full-year.tsv.gz
          cp data/full_year.tsv.gz /tmp/kline-full-year-${D}.tsv.gz
          gh release view full-year -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create full-year -R "$GITHUB_REPOSITORY" \
              --title "近一年全量K线窗口（每日覆盖）" \
              --notes "自动生成：固定名 kline-full-year.tsv.gz 每日覆盖；带日期包保留最近3个交易日。勿手工修改。"
          gh release upload full-year -R "$GITHUB_REPOSITORY" \
            /tmp/kline-full-year.tsv.gz /tmp/kline-full-year-${D}.tsv.gz --clobber
          echo "清理3天前的带日期旧包..."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/full-year" --jq '.assets[].name' > /tmp/assets.txt
          while read -r a; do
            case "$a" in
              kline-full-year-????????.tsv.gz)
                d=${a#kline-full-year-}; d=${d%.tsv.gz}
                age=$(( ( $(date -u +%s) - $(date -u -d "${d:0:4}-${d:4:2}-${d:6:2}" +%s) ) / 86400 ))
                if [ "$age" -gt 3 ]; then
                  gh release delete-asset full-year -R "$GITHUB_REPOSITORY" "$a" -y && echo "已删旧包 $a"
                fi ;;
            esac
          done < /tmp/assets.txt
