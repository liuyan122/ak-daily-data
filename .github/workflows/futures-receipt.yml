name: 期货仓单日频采集
on:
  workflow_dispatch:
    inputs:
      date:
        description: "采集日期 YYYYMMDD，默认今天"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 采集各所仓单
        run: python scripts/futures_receipt.py ${{ github.event.inputs.date }}
      - name: 提交数据到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures_receipt/ futures_receipt_summary.json
          git commit -m "期货仓单 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" || echo "无变化"
          git push
      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-receipt-${{ github.run_id }}
          path: |
            data/futures_receipt/*.tsv.gz
            futures_receipt_summary.json
          retention-days: 30
